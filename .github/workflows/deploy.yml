name: Deploy naar staging

# Elke push naar main zet het thema over SFTP op de server.
# Handmatig starten kan ook, via de Actions-tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Thema uploaden
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Naar de server sturen
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          local_path: './*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
          # Repo-eigen bestanden horen niet op de webserver thuis.
          exclude_file: .git*, .github, README.md, .gitignore
